apiVersion: apps/v1
kind: Deployment
metadata:
  name: designsystemharness-backend
  labels:
    app: designsystemharness-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: designsystemharness-backend
  template:
    metadata:
      labels:
        app: designsystemharness-backend
    spec:
      containers:
        - name: designsystemharness-backend
          image: designsystemharness-backend:node22
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: designsystemharness-backend
spec:
  selector:
    app: designsystemharness-backend
  ports:
    - port: 80
      targetPort: 3000
